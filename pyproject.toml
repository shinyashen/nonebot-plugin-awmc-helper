[project]
name = "nonebot-plugin-awmc-helper"
version = "0.1.0"
description = "NoneBot2 舞萌DX (maimaiDX) 辅助插件：查歌/别名/查分/表格/猜歌/排卡，数据层基于 maimai-py"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "shinyashen", email = "shinyashen@qq.com" }]
keywords = ["nonebot", "maimai", "maimaidx", "舞萌DX", "maimai-py"]
dependencies = [
  "aiosqlite>=0.19.0",                        # 统一 SQLite 异步驱动
  "beautifulsoup4>=4.12.0",                   # gamerch wiki 页面解析
  "httpx>=0.27.0,<1.0.0",
  "maimai-py>=1.6.0",                         # 数据层唯一基础：跟随 PyPI 最新版，不锁上界（下限随升级推进，只写旧下限 pip 视作已满足不会动）
  "nonebot-plugin-alconna>=0.60.0,<1.0.0",    # 跨平台命令解析拓展
  "nonebot-plugin-apscheduler>=0.5.0,<1.0.0", # 定时任务
  "nonebot-plugin-localstore>=0.7.4,<1.0.0",  # 存储文件
  "nonebot-plugin-uninfo>=0.10.0,<1.0.0",     # 多平台用户信息获取
  "nonebot2>=2.4.3,<3.0.0",
  "numpy>=1.26.0",                            # 猜歌曲绘 FFT 裁剪
  "pillow>=10.0.0",                           # PIL 绘图
  "sqlmodel>=0.0.16",                         # 统一 SQLite ORM
  "zhconv>=1.4.3",
]

[project.urls]
Homepage = "https://github.com/shinyashen/nonebot-plugin-awmc-helper"
Issues = "https://github.com/shinyashen/nonebot-plugin-awmc-helper/issues"
Repository = "https://github.com/shinyashen/nonebot-plugin-awmc-helper.git"

[dependency-groups]
dev = [
  "bump-my-version>=1.2.7",
  "nonebot2[fastapi]>=2.4.2,<3.0.0",
  "poethepoet>=0.42.1",
  "ruff>=0.15.2,<1.0.0",
  { include-group = "test" },
]
test = [
  "nonebot-adapter-onebot>=2.4.6,<3.0.0",
  "nonebot2[fastapi]>=2.4.2,<3.0.0",
  "nonebug>=0.3.7,<1.0.0",
  "poethepoet>=0.36.0",
  "pytest-asyncio>=1.3.0,<1.4.0",
  "pytest-cov>=7.0.0",
  "pytest-xdist>=3.8.0,<4.0.0",
  "respx>=0.22.0", # ext 直连层 HTTP mock
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
nonebug = { git = "https://github.com/nonebot/nonebug" }

[tool.bumpversion]
current_version = "0.1.0"
commit = true
message = "release: bump vesion from {current_version} to {new_version}"
tag = true

[[tool.bumpversion.files]]
filename = "uv.lock"
search = "name = \"nonebot-plugin-awmc-helper\"\nversion = \"{current_version}\""
replace = "name = \"nonebot-plugin-awmc-helper\"\nversion = \"{new_version}\""

[tool.coverage.report]
exclude_lines = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
  "except ImportError:",
]

[tool.nonebot]
plugins = ["nonebot_plugin_awmc_helper"]

[tool.poe.tasks]
test = "pytest --cov=src --cov-report xml --junitxml=./junit.xml -n auto"
gen-commands = "python scripts/gen_commands.py" # docs/commands.md 生成（注册表唯一事实源）
bump = "bump-my-version bump"
show-bump = "bump-my-version show-bump"

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
defineConstant = { PYDANTIC_V2 = true }
exclude = [
  "**/local",
  "**/local/repos",
  "**/static",
  "**/.venv",
  "**/data",
  "**/cache",
  "**/__pycache__",
  "**/tests",
]
executionEnvironments = [
  { root = "./tests", extraPaths = [
    "./src",
    "./awmc_plugins/nonebot_plugin_awmc_example/src",
  ] },
  { root = "./src" },
]
typeCheckingMode = "standard"
disableBytesTypePromotions = true

[tool.pytest.ini_options]
addopts = [
  "--import-mode=prepend", # 导入模式
  "--strict-markers",      # 严格标记模式
  "--tb=short",            # 简短的错误回溯
  "-ra",                   # 显示所有测试结果摘要
  "-s",                    # 显示打印信息
  "-v",                    # 详细输出
]
testpaths = ["tests"]    # 只收集本仓库测试，忽略 local/ 下的参考仓库
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 88

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "I",     # isort
  "UP",    # pyupgrade
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "T10",   # flake8-debugger
  "T20",   # flake8-print
  "PYI",   # flake8-pyi
  "PT",    # flake8-pytest-style
  "Q",     # flake8-quotes
  "TID",   # flake8-tidy-imports
  "RUF",   # Ruff-specific rules
]
ignore = [
  "E402",   # module-import-not-at-top-of-file
  "UP037",  # quoted-annotation
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
  "W191",   # indentation contains tabs
  "TID252", # relative-import
]

[tool.ruff.lint.isort]
length-sort = true
known-first-party = ["tests/*"]
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
